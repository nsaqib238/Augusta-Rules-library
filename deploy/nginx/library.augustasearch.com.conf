# Augusta Rules Library — library.augustasearch.com
# Do NOT use ausstd.augustasearch.com (that host is Augusta-Australia uploads).
#
# Install to:
#   /etc/nginx/sites-available/library.augustasearch.com.conf
#   ln -s ... sites-enabled/
#
# Rate-limit zones:
#   deploy/nginx/conf.d/aus-rules-rate-limits.conf → /etc/nginx/conf.d/

server {
    listen 80;
    listen [::]:80;
    server_name library.augustasearch.com;

    client_max_body_size 100m;

    root /var/www/aus-rules-frontend;
    index index.html;

    location /health {
        proxy_pass http://127.0.0.1:8083/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/v1/webhooks/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/v1/query/ask {
        limit_req zone=rules_ask burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
    }

    location /api/v1/access-codes/ {
        limit_req zone=rules_auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=rules_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
