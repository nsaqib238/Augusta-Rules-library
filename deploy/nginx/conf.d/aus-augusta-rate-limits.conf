# Rate-limit zones for Augusta (http context).
# Install:
#   sudo cp deploy/nginx/conf.d/aus-augusta-rate-limits.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Zones are referenced from ausstd.augustasearch.com.conf

# General API: 10 req/s per IP, burst handled in location
limit_req_zone $binary_remote_addr zone=aus_api:10m rate=10r/s;

# Q&A is expensive (LLM): ~1 ask start / 2s sustained per IP
limit_req_zone $binary_remote_addr zone=aus_ask:10m rate=30r/m;

# Passcode / subscription mutate: strict
limit_req_zone $binary_remote_addr zone=aus_auth:10m rate=10r/m;
