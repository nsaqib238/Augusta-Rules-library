# http {} context — install to /etc/nginx/conf.d/
# Separate zone names from aus-augusta-* so both apps can coexist on one nginx.

limit_req_zone $binary_remote_addr zone=rules_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=rules_ask:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=rules_auth:10m rate=2r/s;
